# Cirrus CI wiring for FreeBSD.
#
# GitHub Actions has no FreeBSD runner, so the FreeBSD coverage lives here
# (free for open-source repositories; requires the Cirrus CI GitHub App to
# be installed on the repository). The row mirrors `make check-freebsd`:
# fuse-backend-core and fuse-backend-vfs build and their unit tests pass on
# a real FreeBSD VM. The transport (fuse-backend-fusedev) and the drivers
# (passthrough, overlayfs) cannot build there yet and stay out of the task.

freebsd_task:
  name: FreeBSD CI
  timeout_in: 30m
  env:
    CARGO_TERM_COLOR: always
  freebsd_instance:
    image_family: freebsd-14-2
  install_script:
    # GitHub's runners track the latest stable toolchain; rustup keeps the
    # FreeBSD VM at the same version instead of the quarterly pkg snapshot.
    - fetch https://sh.rustup.rs -o /tmp/rustup.sh
    - sh /tmp/rustup.sh -y --profile minimal --component clippy
  script:
    - . $HOME/.cargo/env && make check-freebsd
