name: Rust

on:
  push:
    branches: '*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  CI:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, ppc64le, riscv64, s390x]
    steps:
    - uses: actions/checkout@v3
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2.2.0
      with:
        cache-on-failure: true
        key: ${{ runner.os }}-cargo-${{ matrix.arch }}

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: build and check
      run: |
        declare -A rust_target_map=( ["amd64"]="x86_64-unknown-linux-musl" ["arm64"]="aarch64-unknown-linux-musl" ["ppc64le"]="powerpc64le-unknown-linux-gnu" ["riscv64"]="riscv64gc-unknown-linux-gnu" ["s390x"]="s390x-unknown-linux-gnu")
        RUST_TARGET=${rust_target_map[${{ matrix.arch }}]}
        cargo install --version 0.2.5 cross
        rustup component add rustfmt clippy
        make -e RUST_TARGET=$RUST_TARGET -e CARGO=cross check
    - name: smoke
      if: ${{ matrix.arch == 'amd64' }}
      run: |
        echo user_allow_other | sudo tee --append /etc/fuse.conf
        CARGO_HOME=${HOME}/.cargo
        CARGO_BIN=$(which cargo)
        # The passthrough link() /proc/self/fd fallback only runs without
        # CAP_DAC_READ_SEARCH, so run the two link tests built for it
        # unprivileged before the privileged rows below re-run the whole
        # suite as root (the other link tests need open_by_handle_at()).
        ${CARGO_BIN} test -p fuse-backend-passthrough --no-default-features -- --nocapture test_link_symlink test_link_regular
        # Drive each criterion microbench once (unprivileged: it exercises
        # PassthroughFs directly, with no mount), so async call-pattern changes
        # that turn a bench test-double stub into a live path fail the build
        # here instead of panicking mid-benchmark.
        make bench-smoke
        sudo -E CARGO=${CARGO_BIN} make test
        sudo -E CARGO=${CARGO_BIN} make smoke-all
        sudo chown -R $(id -u):$(id -g) "${HOME}/.cargo"

  MSRV:
    # `CI` builds on `stable` only, so nothing notices when a change quietly
    # needs a newer rustc than the declared `rust-version`; the
    # trait-object-upcasting requirement slipped in exactly that way. Check
    # with the declared MSRV instead, on a native runner: `--all-features
    # --all-targets` covers the async-io paths that needed the bump, plus the
    # drivers, transports and persist stack on top. The dev-only binaries
    # under tests/ declare no `rust-version` and track the latest
    # dev-dependencies, whose MSRV is not ours to promise (today
    # `simple_logger` 5.2 floors `time` at a release needing rustc 1.88), so
    # they are excluded; the stable-toolchain jobs still build them (`CI`
    # runs the benchmark smoke, `xfstests` and `benchmark` build the daemons).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v3
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2.2.0
      with:
        cache-on-failure: true
        key: ${{ runner.os }}-cargo-msrv
    - name: Read declared MSRV
      # Take the MSRV from the root manifest instead of pinning a second
      # copy here: a pin left behind by a later bump would quietly check a
      # version nobody declares anymore. Cargo still rejects a member whose
      # own rust-version exceeds the toolchain, so the crate manifests
      # cannot drift past what this job checks.
      id: msrv
      run: |
        msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        echo "version=$msrv" >> "$GITHUB_OUTPUT"
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ steps.msrv.outputs.version }}
        override: true
    - name: Check
      # No Cargo.lock is tracked, so dependencies are resolved fresh here.
      # The resolver's default (`allow`) keeps picking versions that need a
      # newer rustc than the declared MSRV; `fallback` prefers versions the
      # MSRV can compile, so the job survives a dependency raising its own
      # rust-version.
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      run: cargo check --workspace --all-features --all-targets --exclude passthrough --exclude overlay --exclude fuse-backend-rs-benchmark

  Macos-CI:
    runs-on: macos-latest
    steps:
      - name: Install macfuse
        run: |
          brew install --cask macfuse
          wget https://github.com/macos-fuse-t/fuse-t/releases/download/1.0.24/fuse-t-macos-installer-1.0.24.pkg
          sudo installer -pkg fuse-t-macos-installer-1.0.24.pkg -target /
      - uses: actions/checkout@v3
      - name: build and check
        run: |
          make smoke-macos

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: EmbarkStudios/cargo-deny-action@v2
