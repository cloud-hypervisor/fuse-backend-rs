name: Rust

# NOTE (2026-11-24): every workflow in this repository suddenly failed at
# the "Getting action download info" stage, because the Actions permissions
# policy was changed to only allow actions from repositories owned by
# cloud-hypervisor, which excludes actions/checkout and every other third
# party action used here. That is a settings-level change, not a code change:
# no workflow file changed between the last green runs (2026-11-23) and the
# first red ones (2026-11-24); see the pull request that rewrote the workflows
# for the diagnosis and the audit-log trail. This workflow now uses no
# actions at all, so it runs under any policy level: checkouts are plain git
# fetches, toolchains come from rustup, and cargo-deny is downloaded from its
# release page.

on:
  push:
    branches: '*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  CI:
    runs-on: ubuntu-latest
    # The smoke step mounts real FUSE filesystems; a hung request through
    # them never returns, and cargo's "over 60 seconds" notice does not abort
    # the test. Bound the job so a hang fails loudly instead of sitting for
    # GitHub's 360-minute default (a full run takes ~7 minutes).
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64, ppc64le, riscv64, s390x]
    steps:
    - name: Checkout
      # Plain git instead of actions/checkout, which the Actions policy no
      # longer allows (see the note at the top of this file). The repository
      # is public, so an anonymous fetch is enough; for pull_request events
      # GITHUB_SHA is the merge commit, which GitHub allows fetching by SHA.
      run: |
        git init "${GITHUB_WORKSPACE}"
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --progress --force FETCH_HEAD
    - name: Install Rust
      # rustup directly instead of actions-rs/toolchain; the runner images
      # already ship rustup. No cargo cache: the policy allows no action
      # that could restore one, so every run re-resolves and re-downloads.
      run: rustup toolchain install --profile minimal stable

    - name: build and check
      run: |
        declare -A rust_target_map=( ["amd64"]="x86_64-unknown-linux-musl" ["arm64"]="aarch64-unknown-linux-musl" ["ppc64le"]="powerpc64le-unknown-linux-gnu" ["riscv64"]="riscv64gc-unknown-linux-gnu" ["s390x"]="s390x-unknown-linux-gnu")
        RUST_TARGET=${rust_target_map[${{ matrix.arch }}]}
        cargo install --version 0.2.5 cross
        rustup component add rustfmt clippy
        make -e RUST_TARGET=$RUST_TARGET -e CARGO=cross check
    - name: smoke
      if: ${{ matrix.arch == 'amd64' }}
      run: |
        echo user_allow_other | sudo tee --append /etc/fuse.conf
        CARGO_HOME=${HOME}/.cargo
        CARGO_BIN=$(which cargo)
        # The passthrough link() /proc/self/fd fallback only runs without
        # CAP_DAC_READ_SEARCH, so run the two link tests built for it
        # unprivileged before the privileged rows below re-run the whole
        # suite as root (the other link tests need open_by_handle_at()).
        ${CARGO_BIN} test -p fuse-backend-passthrough --no-default-features -- --nocapture test_link_symlink test_link_regular
        # Drive each criterion microbench once (unprivileged: it exercises
        # PassthroughFs directly, with no mount), so async call-pattern changes
        # that turn a bench test-double stub into a live path fail the build
        # here instead of panicking mid-benchmark.
        make bench-smoke
        # sudo -E is not supported by sudo-rs (the default sudo on Ubuntu
        # 26.04 runners) and is silently ignored, which resets HOME and
        # leaves the rustup shim at ~/.cargo/bin unable to resolve the
        # default toolchain ("rustup could not choose a version of cargo").
        # Route the environment through env(1) so it is applied after the
        # privilege boundary, independent of the sudo env policy: HOME and
        # RUSTUP_HOME let the cargo/rustc shims find the toolchain, PATH lets
        # cargo re-resolve rustc through the shim directory.
        run_privileged() {
            sudo env HOME="${HOME}" RUSTUP_HOME="${HOME}/.rustup" \
                CARGO_HOME="${HOME}/.cargo" PATH="${PATH}" \
                RUST_BACKTRACE=1 CARGO="${CARGO_BIN}" "$@"
        }
        run_privileged make test
        run_privileged make smoke-all
        sudo chown -R $(id -u):$(id -g) "${HOME}/.cargo"

  MSRV:
    # `CI` builds on `stable` only, so nothing notices when a change quietly
    # needs a newer rustc than the declared `rust-version`; the
    # trait-object-upcasting requirement slipped in exactly that way. Check
    # with the declared MSRV instead, on a native runner: `--all-features
    # --all-targets` covers the async-io paths that needed the bump, plus the
    # drivers, transports and persist stack on top. The dev-only binaries
    # under tests/ declare no `rust-version` and track the latest
    # dev-dependencies, whose MSRV is not ours to promise (today
    # `simple_logger` 5.2 floors `time` at a release needing rustc 1.88), so
    # they are excluded; the stable-toolchain jobs still build them (`CI`
    # runs the benchmark smoke, `xfstests` and `benchmark` build the daemons).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      run: |
        git init "${GITHUB_WORKSPACE}"
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --progress --force FETCH_HEAD
    - name: Read declared MSRV
      # Take the MSRV from the root manifest instead of pinning a second
      # copy here: a pin left behind by a later bump would quietly check a
      # version nobody declares anymore. Cargo still rejects a member whose
      # own rust-version exceeds the toolchain, so the crate manifests
      # cannot drift past what this job checks.
      id: msrv
      run: |
        msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        echo "version=$msrv" >> "$GITHUB_OUTPUT"
    - name: Install Rust
      # A partial version such as "1.86" is itself a rustup channel name,
      # so installing and selecting it with the same string resolves to the
      # same rustc release.
      run: |
        rustup toolchain install --profile minimal "${{ steps.msrv.outputs.version }}"
        rustup default "${{ steps.msrv.outputs.version }}"
    - name: Check
      # No Cargo.lock is tracked, so dependencies are resolved fresh here.
      # The resolver's default (`allow`) keeps picking versions that need a
      # newer rustc than the declared MSRV; `fallback` prefers versions the
      # MSRV can compile, so the job survives a dependency raising its own
      # rust-version.
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      run: cargo check --workspace --all-features --all-targets --exclude passthrough --exclude overlay --exclude fuse-backend-rs-benchmark

  Macos-CI:
    runs-on: macos-latest
    # The e2e mounts a fuse-t filesystem; a hung request through a hard NFS
    # mount never returns, and without a timeout the job sits for GitHub's
    # 360-minute default.
    timeout-minutes: 30
    steps:
      - name: Install macfuse
        run: |
          brew install --cask macfuse
          # fuse-t 1.0.24 (the original pin, 2023-era) emits xattr requests no
          # macFUSE-shaped daemon can parse, which hung the e2e's hard NFS
          # mount; 1.2.9 is the current release and is what the e2e runs
          # against.
          wget https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.9/fuse-t-macos-installer-1.2.9.pkg
          sudo installer -pkg fuse-t-macos-installer-1.2.9.pkg -target /
      - name: Checkout
        # Plain git instead of actions/checkout, which the Actions policy
        # no longer allows; see the note at the top of rust.yml. No cargo
        # cache either: the policy allows no action that could restore one,
        # so every run re-resolves and re-downloads the dependency tree.
        run: |
          git init "${GITHUB_WORKSPACE}"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --progress --force FETCH_HEAD
      - name: build and check
        run: |
          make smoke-macos

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        run: |
          git init "${GITHUB_WORKSPACE}"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --progress --force FETCH_HEAD
      - name: Cargo Deny
        # cargo-deny straight from its release tarball, pinned, instead of
        # EmbarkStudios/cargo-deny-action, which the Actions policy no
        # longer allows.
        run: |
          ver=0.22.1
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "${HOME}/.cargo/bin" --strip-components=1 "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny"
          cargo deny check
