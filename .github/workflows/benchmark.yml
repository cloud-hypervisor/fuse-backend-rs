# Benchmark the synchronous, asynchronous, io_uring and kernel-passthrough
# fusedev IO paths, and (on the run-fuser-compare label) the library
# comparison against the fuser crate.
#
# Triggers:
#   - pull requests: add the "run-benchmark" label to benchmark the PR.
#     Both the merge base and the PR are built and benchmarked back to
#     back IN THE SAME JOB, on the same runner, and the two result sets
#     are compared. Comparing against a baseline recorded on a different
#     runner turned out to be useless: GitHub-hosted runners are shared
#     VMs whose performance fluctuates by tens of percent, which even
#     produced "regressions" on code paths the PR did not touch.
#   - pull requests: add the "run-fuser-compare" label to run the
#     fuse-backend-rs vs fuser library comparison of the PR head. Both
#     daemons are measured back to back in the same job, so the
#     cross-daemon deltas are the signal; absolute numbers from a shared
#     runner are not comparable across runs. Both daemons run with the
#     FUSE writeback cache off (the backend one via --no-writeback; fuser
#     cannot negotiate it), so the write path compares like for like.
#   - pushes to master / workflow_dispatch: a single run, the collected
#     results are written to the job summary for reference.
#
# The uring mode requires kernel 6.14+ with FUSE-over-io_uring enabled
# (the fuse module parameter enable_uring defaults to off on several
# distro kernels); the benchmark script turns it on when it can and
# skips the mode when the kernel still rejects the transport.
# The merge base predates the uring transport, so only the PR variant
# runs that mode; its numbers are compared cross-mode against the
# sync/async results of the same run, which needs no baseline.
#
# The passthrough mode requires kernel 6.9+ with CONFIG_FUSE_PASSTHROUGH;
# the benchmark script skips it on kernels known to lack the
# configuration. It is compared against the nowriteback control mode
# (the same daemon with just the FUSE writeback cache off) of the same
# run, so the deltas isolate the kernel passthrough effect from the
# writeback cache effect; the baseline daemon predates the flags, so
# again only the PR variant runs either mode.
#
# The comparison is advisory and never fails the workflow; significant
# regressions must be re-checked on bare metal.

name: Benchmark

on:
  pull_request:
    types: [labeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        threads: [1, 8]
    steps:
    - uses: actions/checkout@v3
      with:
        # Full history so that the merge base can be checked out below for
        # the A/B comparison (pull_request checkouts are shallow by default).
        fetch-depth: 0
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2.2.0
      with:
        cache-on-failure: true

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Install tools
      run: |
        if ! command -v fio >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y fio jq
        fi

    - name: Check out the baseline variant
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base-src

    - name: Build the baseline daemon
      if: github.event_name == 'pull_request'
      run: |
        # Build the baseline into a target directory of its own. The two
        # checkouts hold same-named path packages (fuse-backend-core,
        # fusedev, ...), and cargo keys their unit slots on the package
        # identity rather than the checkout, so a shared target/ makes
        # the current build reuse artifacts fingerprinted by the
        # baseline build: the baseline is checked out later, so its
        # fingerprints are newer than the main checkout's sources and
        # cargo's mtime freshness check wrongly calls them fresh. The
        # current daemon is then built against baseline rlibs, which
        # either fails to compile (a PR that adds an ABI item, e.g.
        # E0432 no `BackingMap`) or, worse, silently measures the
        # baseline against itself. Registry dependencies are rebuilt
        # for the baseline instead of shared, which costs a few
        # minutes of CI time but keeps the two variants honest.
        (cd base-src/tests/benchmark && CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target-base" cargo build --release)
        mkdir -p variants
        cp target-base/release/fuse-backend-rs-benchmark variants/daemon-base

    - name: Build the current daemon
      run: |
        (cd tests/benchmark && cargo build --release)
        mkdir -p variants
        cp target/release/fuse-backend-rs-benchmark variants/daemon-current

    - name: Run benchmarks
      run: |
        echo user_allow_other | sudo tee --append /etc/fuse.conf
        CARGO_HOME=${HOME}/.cargo
        CARGO_BIN=$(which cargo)
        # Both variants are measured with this very script of the PR,
        # so the workload definition is identical. The baseline daemon
        # predates the uring transport and would reject --uring, and it
        # predates --kernel-passthrough and --no-writeback as well, so
        # only the current variant runs those modes (the script itself
        # skips uring when the kernel does not accept FUSE-over-io_uring,
        # and passthrough on kernels known to lack CONFIG_FUSE_PASSTHROUGH).
        SCRIPT=tests/scripts/bench_sync_async.sh
        run_variant() {
            local modes="sync async"
            [ "$1" = current ] && modes="sync async uring nowriteback passthrough"
            # sudo -E is not supported by sudo-rs (the default sudo on
            # Ubuntu 26.04 runners); route the environment through env(1)
            # so it is applied after the privilege boundary and the env
            # policy cannot drop PATH or the BENCH_* knobs. RUST_BACKTRACE
            # matches the workflow-level env -E used to preserve.
            sudo env PATH="$(dirname "${CARGO_BIN}"):${PATH}" CARGO_HOME="${CARGO_HOME}" \
                RUST_BACKTRACE=1 \
                BENCH_THREADS=${{ matrix.threads }} BENCH_RUNTIME=30 BENCH_MODES="${modes}" \
                BENCH_DAEMON="${GITHUB_WORKSPACE}/variants/daemon-$1" \
                BENCH_RESULTS_DIR="${GITHUB_WORKSPACE}/bench-$1" \
                "${SCRIPT}"
            sudo chown -R $(id -u):$(id -g) "${HOME}/.cargo"
        }
        if [ "${{ github.event_name }}" = pull_request ]; then
            # Alternate the execution order between the thread counts to
            # spread runner drift (warmup, thermals) across the variants.
            if [ "${{ matrix.threads }}" = 1 ]; then
                run_variant base
                run_variant current
            else
                run_variant current
                run_variant base
            fi
        else
            run_variant current
        fi

    - name: Collect results
      run: |
        for variant in current base; do
            [ -d "bench-${variant}" ] || continue
            for mode in sync async uring nowriteback passthrough; do
                # The uring and passthrough modes are skipped on kernels
                # without FUSE_URING / CONFIG_FUSE_PASSTHROUGH, and all
                # three of uring, nowriteback and passthrough never run
                # for the baseline variant.
                compgen -G "bench-${variant}/${mode}-*.json" > /dev/null || continue
                python3 tests/scripts/bench_compare.py collect \
                    "${GITHUB_WORKSPACE}/bench-${variant}" "${mode}" \
                    "${GITHUB_WORKSPACE}/${variant}-${mode}-${{ matrix.threads }}threads.json"
            done
        done

    - name: Compare variants
      if: github.event_name == 'pull_request'
      run: |
        {
            echo "## Benchmark: PR vs merge base (same runner, ${{ matrix.threads }} thread(s))"
            echo ""
            for mode in sync async; do
                python3 tests/scripts/bench_compare.py compare \
                    "base-${mode}-${{ matrix.threads }}threads.json" \
                    "current-${mode}-${{ matrix.threads }}threads.json"
            done
            echo "Both variants were measured back to back on the same runner;"
            echo "regressions beyond the threshold (10%) are still advisory,"
            echo "GitHub-hosted runners drift over time even within one job."
        } >> "${GITHUB_STEP_SUMMARY}"

        # Cross-mode comparison of the two classic transports of this
        # very PR run: both numbers come from the current variant,
        # measured back to back in this same job, so environment effects
        # cancel out and no merge-base baseline is needed.
        {
            echo ""
            echo "### Cross-mode comparison: sync vs async of this PR"
            echo ""
            echo "Positive deltas mean async outperformed sync on that workload."
            echo ""
        } >> "${GITHUB_STEP_SUMMARY}"
        python3 tests/scripts/bench_compare.py compare \
            "current-sync-${{ matrix.threads }}threads.json" \
            "current-async-${{ matrix.threads }}threads.json" >> "${GITHUB_STEP_SUMMARY}"

        # Cross-mode comparison of the uring transport against the classic
        # transports of this very PR run: same job and same machine, so
        # environment effects cancel out, and no baseline is needed (the
        # merge base predates the uring transport). Absent on runners
        # whose kernels reject FUSE-over-io_uring.
        URING_JSON="current-uring-${{ matrix.threads }}threads.json"
        if [ -f "${URING_JSON}" ]; then
            for mode in sync async; do
                {
                    echo ""
                    echo "### Cross-mode comparison: uring vs ${mode} of this PR"
                    echo ""
                    echo "Positive deltas mean uring outperformed ${mode} on that workload."
                    echo ""
                } >> "${GITHUB_STEP_SUMMARY}"
                python3 tests/scripts/bench_compare.py compare \
                    "current-${mode}-${{ matrix.threads }}threads.json" \
                    "${URING_JSON}" >> "${GITHUB_STEP_SUMMARY}"
            done
        fi

        # Cross-mode comparisons isolating the kernel passthrough effect
        # of this very PR run: nowriteback vs sync shows what the FUSE
        # writeback cache itself contributes, and passthrough vs
        # nowriteback compares two runs of the same sync daemon that
        # differ only in the kernel serving the IO on the backing files,
        # so those deltas are the kernel passthrough effect alone. The
        # passthrough table is absent on runners whose kernels predate
        # or disable FUSE passthrough.
        NWB_JSON="current-nowriteback-${{ matrix.threads }}threads.json"
        if [ -f "${NWB_JSON}" ]; then
            {
                echo ""
                echo "### Cross-mode comparison: nowriteback vs sync of this PR"
                echo ""
                echo "Positive deltas mean the sync daemon without the writeback"
                echo "cache outperformed the one with the cache on that workload."
                echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            python3 tests/scripts/bench_compare.py compare \
                "current-sync-${{ matrix.threads }}threads.json" \
                "${NWB_JSON}" >> "${GITHUB_STEP_SUMMARY}"
        fi
        PT_JSON="current-passthrough-${{ matrix.threads }}threads.json"
        if [ -f "${NWB_JSON}" ] && [ -f "${PT_JSON}" ]; then
            {
                echo ""
                echo "### Cross-mode comparison: passthrough vs nowriteback of this PR"
                echo ""
                echo "Positive deltas mean kernel passthrough outperformed the same"
                echo "daemon with just the writeback cache off, so the deltas are"
                echo "the kernel passthrough effect alone."
                echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            python3 tests/scripts/bench_compare.py compare \
                "${NWB_JSON}" \
                "${PT_JSON}" >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Show results
      if: github.event_name != 'pull_request'
      run: |
        {
            echo "## Benchmark results (${{ matrix.threads }} thread(s))"
            echo ""
            echo "Single run on the merge target, no comparison. See the"
            echo "artifacts for the raw fio results."
            if [ -f "current-uring-${{ matrix.threads }}threads.json" ]; then
                echo ""
                echo "This runner's kernel supports FUSE_URING, so the run"
                echo "covered the uring transport as well."
            fi
            if [ -f "current-passthrough-${{ matrix.threads }}threads.json" ]; then
                echo ""
                echo "This runner's kernel reports FUSE passthrough support, so the run"
                echo "covered the kernel passthrough mode as well (unverified when the"
                echo "kernel configuration was not readable)."
            fi
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: bench-${{ matrix.threads }}threads
        path: |
          current-*.json
          base-*.json

  # Library comparison: the PR head's fuse-backend-rs against the fuser
  # crate, both serving the same passthrough workloads from daemons built
  # from this very checkout. Both daemons run in the same job on the same
  # runner, so the per-workload deltas cancel environment effects; the
  # absolute numbers are only meaningful relative to each other. The
  # results table is advisory and never fails the workflow.
  fuser-compare:
    if: github.event_name == 'pull_request' && github.event.label.name == 'run-fuser-compare'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v3

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2.2.0
      with:
        cache-on-failure: true

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Install tools
      run: |
        if ! command -v fio >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y fio
        fi
        # The fuser daemon mounts through the fusermount3 helper and uses
        # AutoUnmount with SessionACL::All, which need fuse3 and
        # user_allow_other respectively.
        sudo apt-get install -y fuse3
        echo user_allow_other | sudo tee --append /etc/fuse.conf

    - name: Build both daemons
      run: |
        cargo build --release -p fuse-backend-rs-benchmark -p passthrough-fuser

    - name: Run the library comparison
      run: |
        CARGO_BIN=$(which cargo)
        # sudo -E is not supported by sudo-rs (the default sudo on
        # Ubuntu 26.04 runners); route the environment through env(1).
        # Progress goes to the log; the results table goes to stdout,
        # which is appended to the job summary below.
        sudo env PATH="$(dirname "${CARGO_BIN}"):${PATH}" CARGO_HOME="${HOME}/.cargo" \
            RUST_BACKTRACE=1 \
            BACKEND_BIN="${GITHUB_WORKSPACE}/target/release/fuse-backend-rs-benchmark" \
            FUSER_BIN="${GITHUB_WORKSPACE}/target/release/passthrough-fuser" \
            RESULTS_DIR="${GITHUB_WORKSPACE}/fuser-compare-results" \
            THREADS_LIST="1 8" \
            bash tests/scripts/bench_library_compare.sh \
            > "${GITHUB_WORKSPACE}/fuser-compare-table.txt"
        sudo chown -R $(id -u):$(id -g) "${HOME}/.cargo"

    - name: Show results
      if: always()
      run: |
        {
            echo "## Library comparison: fuse-backend-rs vs fuser (PR head)"
            echo ""
            echo "Both daemons were built from this PR's checkout and measured"
            echo "back to back on the same runner, with the FUSE writeback cache"
            echo "off on both sides (fuser cannot negotiate it), so the deltas"
            echo "are the signal; absolute numbers from a shared runner are not"
            echo "comparable across runs. The deltas are advisory; conclusions"
            echo "about either library should be re-checked on bare metal."
            echo ""
            echo '```'
            cat "${GITHUB_WORKSPACE}/fuser-compare-table.txt" || echo "no results: the comparison did not run"
            echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuser-compare-results
        path: |
          fuser-compare-table.txt
          fuser-compare-results/
