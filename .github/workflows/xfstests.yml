name: xfstests

on:
  # Runner budget (2026-11-25): these suites used to run on every push
  # to every branch and on every pull request, which together with the
  # arch matrix in rust.yml saturated the shared org runner pool (see
  # the note there) and got Actions disabled repo-wide. They now run
  # nightly and on demand; pull requests no longer run them, so branch
  # protection must not list them as required checks.
  workflow_dispatch:
    inputs:
      suite:
        description: 'e2e suite to run'
        type: choice
        options: [all, xfstests-passthrough, xfstests-overlay, unionmount, hardlink]
        default: all
  schedule:
    # Nightly, staggered after rust.yml's full-matrix run (03:10 UTC);
    # schedule events run the default branch's copy of this workflow.
    - cron: '10 3 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  xfstests_on_passthrough:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.suite == 'all'
      || github.event.inputs.suite == 'xfstests-passthrough'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    - name: Build passthrough binary
      run: |
        cargo build --release -p passthrough
        sudo install -t /usr/sbin/ -m 700 ./target/release/passthrough
    - name: Setup and run xfstest
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/xfstests_pathr.sh

  xfstests_on_overlayfs:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.suite == 'all'
      || github.event.inputs.suite == 'xfstests-overlay'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    - name: Build overlay binary
      run: |
        cargo build --release -p overlay
        sudo install -t /usr/sbin/ -m 700 ./target/release/overlay
    - name: Setup and run xfstest
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/xfstests_overlay.sh

  unionmount_testsuite_on_overlayfs:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.suite == 'all'
      || github.event.inputs.suite == 'unionmount'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    - name: Build overlay binary
      run: |
        cargo build --release -p overlay
        sudo install -t /usr/sbin/ -m 700 ./target/release/overlay
    - name: Setup and run unionmount testsuite
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/unionmount_test_overlay.sh

  hardlink_e2e_on_overlayfs:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.suite == 'all'
      || github.event.inputs.suite == 'hardlink'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    # Nothing to install: the runner image ships fuse3, which provides
    # fusermount/fusermount3 and on Ubuntu 24.04 conflicts with fuse
    # (fuse3 Breaks: fuse), so the two packages can never coexist.
    - name: Build overlay binary
      run: cargo build --release -p overlay
    # Run as root like the sibling suites: the unprivileged mode the
    # script also supports needs user_allow_other in /etc/fuse.conf
    # (fusermount3 rejects allow_other for non-root without it) and a
    # kernel permitting unprivileged 0/0 char-device mknod, and stock
    # runners provide neither. Under root the passthrough
    # /proc/self/fd link() fallback is not exercised
    # (CAP_DAC_READ_SEARCH makes the first linkat attempt succeed).
    - name: Run hardlink e2e
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/hardlink_e2e.sh ./target/release/overlay