name: xfstests

on:
  push:
    branches: '*'
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  xfstests_on_passthrough:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # See tests/scripts/xfstests_pathr.sh.
        mode: [default, sync, async-tokio, async-tokio-uring, uring, no-writeback, kernel-passthrough]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    - name: Build passthrough binary
      run: |
        cargo build --release -p passthrough
        sudo install -t /usr/sbin/ -m 700 ./target/release/passthrough
    # The runners' kernel has FUSE-over-io_uring built in but off by default.
    - name: Enable FUSE-over-io_uring
      if: matrix.mode == 'uring'
      run: echo 1 | sudo tee /sys/module/fuse/parameters/enable_uring
    - name: Setup and run xfstest
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/xfstests_pathr.sh ${{ matrix.mode }}
    # The mount helper starts the daemon in the background, so only the log
    # shows why a daemon failed to start. A job that fails before the first
    # mount has no log.
    - name: Show the daemon log
      if: failure()
      run: if [ -f /tmp/testpassthrough.log ]; then sudo tail -n 200 /tmp/testpassthrough.log; fi

  xfstests_on_overlayfs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    - name: Build overlay binary
      run: |
        cargo build --release -p overlay
        sudo install -t /usr/sbin/ -m 700 ./target/release/overlay
    - name: Setup and run xfstest
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/xfstests_overlay.sh

  unionmount_testsuite_on_overlayfs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    - name: Build overlay binary
      run: |
        cargo build --release -p overlay
        sudo install -t /usr/sbin/ -m 700 ./target/release/overlay
    - name: Setup and run unionmount testsuite
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/unionmount_test_overlay.sh

  hardlink_e2e_on_overlayfs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    # Nothing to install: the runner image ships fuse3, which provides
    # fusermount/fusermount3 and on Ubuntu 24.04 conflicts with fuse
    # (fuse3 Breaks: fuse), so the two packages can never coexist.
    - name: Build overlay binary
      run: cargo build --release -p overlay
    # Run as root like the sibling suites: the unprivileged mode the
    # script also supports needs user_allow_other in /etc/fuse.conf
    # (fusermount3 rejects allow_other for non-root without it) and a
    # kernel permitting unprivileged 0/0 char-device mknod, and stock
    # runners provide neither. Under root the passthrough
    # /proc/self/fd link() fallback is not exercised
    # (CAP_DAC_READ_SEARCH makes the first linkat attempt succeed).
    - name: Run hardlink e2e
      run: |
        cd $GITHUB_WORKSPACE
        sudo ./tests/scripts/hardlink_e2e.sh ./target/release/overlay