name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

env:
  CARGO_TERM_COLOR: always

# gh release create needs write access to the repository contents; the
# default token permissions are not guaranteed to include it.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Plain git instead of actions/checkout, which the Actions policy
        # no longer allows; see the note at the top of rust.yml. The tag's
        # commit is fetched by SHA, which GitHub supports.
        run: |
          git init "${GITHUB_WORKSPACE}"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --progress --force FETCH_HEAD
      - name: Publish
        run: |
          sudo apt-get update && sudo apt-get install --yes sed
          CRATES="core vfs passthrough overlayfs virtiofs fusedev"
          VERSION=$(sed --regexp-extended --silent 's/^version = \"(.*)"$/\1/p' Cargo.toml)
          [ "$GITHUB_REF_NAME" == "v$VERSION" ]
          # All seven crates are published from one tag; fail early if any
          # manifest drifts apart.
          for CRATE in $CRATES; do
            CRATE_VERSION=$(sed --regexp-extended --silent 's/^version = \"(.*)"$/\1/p' crates/fuse-backend-$CRATE/Cargo.toml)
            [ "$VERSION" == "$CRATE_VERSION" ]
          done
          # The workspace crates depend on each other by path, and `cargo
          # publish` resolves those dependencies against the registry, so
          # publish bottom-up: core first (everything depends on it), vfs next
          # (it depends only on core, and passthrough's dev-dependency on vfs is
          # resolved from the registry), passthrough before fusedev (fusedev's
          # Linux dev-dependency on passthrough is resolved from the registry as
          # well), and the umbrella last (it depends on all six sub-crates).
          for CRATE in $CRATES; do
            cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p fuse-backend-$CRATE
          done
          cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Release
        # softprops/action-gh-release is not allowed by the Actions policy;
        # the preinstalled gh CLI does the same. The release already exists
        # when this job is re-run, so view-then-create keeps re-runs green.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" ||
            gh release create "${GITHUB_REF_NAME}" --generate-notes
