name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Publish
        run: |
          sudo apt-get update && sudo apt-get install --yes sed
          VERSION=$(sed --regexp-extended --silent 's/^version = \"(.*)"$/\1/p' Cargo.toml)
          CORE_VERSION=$(sed --regexp-extended --silent 's/^version = \"(.*)"$/\1/p' crates/fuse-backend-core/Cargo.toml)
          [ "$GITHUB_REF_NAME" == "v$VERSION" ]
          # Both crates are published from one tag; fail early if the two
          # manifests drift apart.
          [ "$VERSION" == "$CORE_VERSION" ]
          # fuse-backend-rs depends on fuse-backend-core by path, so core
          # must be published first.
          cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p fuse-backend-core
          cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
