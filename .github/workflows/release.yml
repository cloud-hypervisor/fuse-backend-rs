name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Publish
        run: |
          sudo apt-get update && sudo apt-get install --yes sed
          CRATES="core passthrough overlayfs virtiofs fusedev"
          VERSION=$(sed --regexp-extended --silent 's/^version = \"(.*)"$/\1/p' Cargo.toml)
          [ "$GITHUB_REF_NAME" == "v$VERSION" ]
          # All six crates are published from one tag; fail early if any
          # manifest drifts apart.
          for CRATE in $CRATES; do
            CRATE_VERSION=$(sed --regexp-extended --silent 's/^version = \"(.*)"$/\1/p' crates/fuse-backend-$CRATE/Cargo.toml)
            [ "$VERSION" == "$CRATE_VERSION" ]
          done
          # The workspace crates depend on each other by path, and `cargo
          # publish` resolves those dependencies against the registry, so
          # publish bottom-up: core first (everything depends on it),
          # passthrough before fusedev (fusedev's Linux dev-dependency on
          # passthrough is resolved from the registry as well), and the
          # umbrella last (it depends on all five sub-crates).
          for CRATE in $CRATES; do
            cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} -p fuse-backend-$CRATE
          done
          cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
