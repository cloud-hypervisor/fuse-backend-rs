[package]
name = "fuse-backend-rs"
version = "0.14.0"
keywords = ["fuse", "virtio", "virtio-fs", "vhost-user-fs"]
categories = ["filesystem", "os::linux-apis"]
description = "A rust library for Fuse(filesystem in userspace) servers and virtio-fs devices"
authors = [
    "Liu Bo <bo.liu@linux.alibaba.com>",
    "Liu Jiang <gerry@linux.alibaba.com>",
    "Peng Tao <bergwolf@hyper.sh>",
]
readme = "README.md"
license = "Apache-2.0 AND BSD-3-Clause"
edition = "2018"
rust-version = "1.80"
repository = "https://github.com/cloud-hypervisor/fuse-backend-rs"
homepage = "https://github.com/cloud-hypervisor/"

[workspace]
members = [
    "crates/fuse-backend-core",
    "crates/fuse-backend-fusedev",
    "crates/fuse-backend-virtiofs",
    "crates/fuse-backend-passthrough",
    "crates/fuse-backend-overlayfs",
    "tests/passthrough",
    "tests/overlay",
    "tests/benchmark",
]

[workspace.dependencies]
# rust-vmm crates
virtio-queue = "0.17.0"
vm-memory = "=0.17.1"
vmm-sys-util = "0.15.0"

[dependencies]
# The versions are required so the umbrella crate can be packaged and
# published against the registry copies once the sub-crates are released.
fuse-backend-core = { path = "crates/fuse-backend-core", version = "0.14.0" }
fuse-backend-fusedev = { path = "crates/fuse-backend-fusedev", version = "0.14.0", optional = true }
fuse-backend-virtiofs = { path = "crates/fuse-backend-virtiofs", version = "0.14.0", optional = true }

# The filesystem drivers are Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
fuse-backend-passthrough = { path = "crates/fuse-backend-passthrough", version = "0.14.0", optional = true }
fuse-backend-overlayfs = { path = "crates/fuse-backend-overlayfs", version = "0.14.0", optional = true }

[dev-dependencies]
async-trait = "0.1.42"
libc = "0.2.68"
log = "0.4.6"
nix = "0.24"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
vmm-sys-util = "0.15.0"

[features]
default = ["fusedev"]
# Facade feature mapping: each historical feature name is forwarded onto the
# sub-crate dependencies. The transports keep pulling in the drivers they have
# always been bundled with, so historical builds see the same modules; the
# `passthrough`/`overlayfs` features additionally allow selecting a driver on
# its own. The `dep:` prefix keeps the dependency crate names themselves out of
# the public feature list.
#
# Forwarding `async-io` to the sub-crates with the `pkg/feature` syntax also
# activates those optional dependencies, so an async-io-only build compiles
# the sub-crates even when no transport feature is selected. The umbrella's
# own re-exports stay gated on the transport features below, so its public
# surface is unchanged; resolver-level weak dependencies would avoid the
# extra compilation but require `resolver = "2"`.
async-io = [
    "fuse-backend-core/async-io",
    "fuse-backend-fusedev/async-io",
    "fuse-backend-virtiofs/async-io",
    "fuse-backend-passthrough/async-io",
    "fuse-backend-overlayfs/async-io",
]
fusedev = [
    "dep:fuse-backend-fusedev",
    "dep:fuse-backend-passthrough",
    "dep:fuse-backend-overlayfs",
]
virtiofs = [
    "dep:fuse-backend-virtiofs",
    "fuse-backend-passthrough/virtiofs",
    "dep:fuse-backend-overlayfs",
]
# Historical name: a vhost-user-fs server is a virtio-fs device served over
# vhost-user, so the feature maps onto exactly the virtiofs build. The
# pre-split `vhost` dependency it once pulled was never referenced by code
# and was dropped in the crate split.
vhost-user-fs = ["virtiofs"]
# Driver-only builds, without any of the bundled transports.
passthrough = ["dep:fuse-backend-passthrough"]
overlayfs = ["dep:fuse-backend-overlayfs"]
persist = ["fuse-backend-core/persist"]
fuse-t = ["fuse-backend-fusedev/fuse-t"]
# Experimental: FUSE-over-io_uring transport (kernel >= 6.14, protocol 7.42).
# The kernel interface is still evolving (queue-count reduction, bufpool
# extensions); the API and ABI target may change between releases.
fusedev-uring = ["fusedev", "fuse-backend-fusedev/uring"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
