[package]
name = "fuse-backend-rs"
version = "0.14.0"
keywords = ["fuse", "virtio", "virtio-fs", "vhost-user-fs"]
categories = ["filesystem", "os::linux-apis"]
description = "A rust library for Fuse(filesystem in userspace) servers and virtio-fs devices"
authors = [
    "Liu Bo <bo.liu@linux.alibaba.com>",
    "Liu Jiang <gerry@linux.alibaba.com>",
    "Peng Tao <bergwolf@hyper.sh>",
]
readme = "README.md"
license = "Apache-2.0 AND BSD-3-Clause"
edition = "2018"
repository = "https://github.com/cloud-hypervisor/fuse-backend-rs"
homepage = "https://github.com/cloud-hypervisor/"
build = "build.rs"

[workspace]
members = [
    "crates/fuse-backend-core",
    "tests/passthrough",
    "tests/overlay",
    "tests/benchmark",
]

[workspace.dependencies]
# rust-vmm crates
vhost = "0.15.0"
virtio-bindings = "0.2.7"
virtio-queue = "0.17.0"
vm-memory = "=0.17.1"
vmm-sys-util = "0.15.0"

[dependencies]
async-trait = { version = "0.1.42", optional = true }
bitflags = "1.1"
# The version is required so the umbrella crate can be packaged and
# published against the registry copy once core is released.
fuse-backend-core = { path = "crates/fuse-backend-core", version = "0.14.0" }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }
io-uring = { version = "0.5.8", optional = true }
libc = "0.2.68"
log = "0.4.6"
mio = { version = "0.8", features = ["os-poll", "os-ext"] }
nix = "0.24"
radix_trie = "0.2.1"
tokio = { version = "1", optional = true }
vmm-sys-util = { workspace = true, optional = true }
vm-memory = { workspace = true, features = ["backend-mmap"] }
virtio-bindings = { workspace = true, optional = true }
virtio-queue = { workspace = true, optional = true }
vhost = { workspace = true, features = ["vhost-user","vhost-user-backend"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = { version = ">=0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
caps = { version = "0.5", optional = true }
tokio-uring = { version = "0.4.0", optional = true }

[dev-dependencies]
vmm-sys-util = "0.15.0"
tempfile = "3"
vm-memory = { version = "=0.17.1", features = ["backend-mmap", "backend-bitmap"] }

[features]
default = ["fusedev"]
async-io = [
    "fuse-backend-core/async-io",
    "async-trait",
    "futures-util",
    "tokio-uring",
    "tokio/fs",
    "tokio/sync",
    "tokio/rt",
    "tokio/macros",
    "io-uring",
]
fusedev = ["fuse-backend-core/fusedev", "vmm-sys-util", "caps", "core-foundation-sys"]
virtiofs = ["fuse-backend-core/virtiofs", "virtio-queue", "caps", "vmm-sys-util"]
vhost-user-fs = ["virtiofs", "fuse-backend-core/vhost-user-fs", "vhost", "caps"]
persist = ["fuse-backend-core/persist"]
fuse-t = ["fuse-backend-core/fuse-t"]
# Experimental: FUSE-over-io_uring transport (kernel >= 6.14, protocol 7.42).
# The kernel interface is still evolving (queue-count reduction, bufpool
# extensions); the API and ABI target may change between releases.
fusedev-uring = ["fusedev", "io-uring", "fuse-backend-core/fusedev-uring"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
