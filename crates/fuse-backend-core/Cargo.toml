[package]
name = "fuse-backend-core"
version = "0.14.0"
keywords = ["fuse", "virtio", "virtio-fs"]
categories = ["filesystem", "os::linux-apis"]
description = "Core FUSE ABI, API, buffer and async-runtime layers for FUSE servers and virtio-fs devices"
authors = [
    "Liu Bo <bo.liu@linux.alibaba.com>",
    "Liu Jiang <gerry@linux.alibaba.com>",
    "Peng Tao <bergwolf@hyper.sh>",
]
license = "Apache-2.0 AND BSD-3-Clause"
edition = "2018"
repository = "https://github.com/cloud-hypervisor/fuse-backend-rs"
homepage = "https://github.com/cloud-hypervisor/"
readme = "README.md"
documentation = "https://docs.rs/fuse-backend-core"

[dependencies]
arc-swap = "1.5"
async-trait = { version = "0.1.42", optional = true }
bitflags = "1.1"
dbs-snapshot = { version = "1.5.2", optional = true }
io-uring = { version = "0.5.8", optional = true }
lazy_static = "1.4"
libc = "0.2.68"
log = "0.4.6"
tokio = { version = "1", optional = true }
vm-memory = { workspace = true, features = ["backend-mmap"] }
versionize_derive = { version = "0.1.6", optional = true }
versionize = { version = "0.2.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.4.0", optional = true }

[dev-dependencies]
tempfile = "3"
vm-memory = { version = "=0.17.1", features = ["backend-mmap", "backend-bitmap"] }

[features]
default = []
async-io = [
    "async-trait",
    "tokio-uring",
    "tokio/fs",
    "tokio/sync",
    "tokio/rt",
    "tokio/macros",
    "io-uring",
]
persist = ["dbs-snapshot", "versionize", "versionize_derive"]
# The features below carry no dependencies of their own. They are forwarded
# from the umbrella `fuse-backend-rs` crate (and enabled directly by the
# transport crates) so that code historically written in one crate and
# cfg-gated on these names keeps compiling with identical semantics
# (buffer Error variants, server notify/uring/DAX handlers, and macFUSE
# reply quirks).
fusedev = []
virtiofs = []
vhost-user-fs = ["virtiofs"]
fusedev-uring = []
fuse-t = []

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
