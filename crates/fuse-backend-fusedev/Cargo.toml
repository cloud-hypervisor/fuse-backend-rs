[package]
name = "fuse-backend-fusedev"
version = "0.14.0"
keywords = ["fuse", "fusedev", "fuse-t"]
categories = ["filesystem", "os::linux-apis"]
description = "The /dev/fuse and FUSE-over-io_uring transport for FUSE servers, and the macFUSE/fuse-t transport for macOS"
authors = [
    "Liu Bo <bo.liu@linux.alibaba.com>",
    "Liu Jiang <gerry@linux.alibaba.com>",
    "Peng Tao <bergwolf@hyper.sh>",
]
license = "Apache-2.0 AND BSD-3-Clause"
edition = "2018"
rust-version = "1.86"
repository = "https://github.com/cloud-hypervisor/fuse-backend-rs"
homepage = "https://github.com/cloud-hypervisor/"
readme = "README.md"
documentation = "https://docs.rs/fuse-backend-fusedev"
build = "build.rs"

[dependencies]
# `features = ["fusedev"]` is not optional: this transport unconditionally
# constructs `buffer::Error::SessionFailure` and serves through the core
# server methods that are gated on the `fusedev` cfg in core.
fuse-backend-core = { path = "../fuse-backend-core", version = "0.14.0", features = ["fusedev"] }
# The io_uring transport calls its zero-copy traits through `dyn`, so
# their async methods need async-trait.
async-trait = { version = "0.1.42", optional = true }
libc = "0.2.68"
log = "0.4.6"
# nix dropped its default features in 0.27, so the modules the sessions use
# are listed explicitly. `time` covers the timerfd the async-serving tests
# drive tokio's IO driver with; `event` provides epoll on Linux; `zerocopy`
# provides splice on Linux.
nix = { version = "0.31", features = [
    "event",
    "fs",
    "ioctl",
    "mount",
    "poll",
    "process",
    "signal",
    "socket",
    "time",
    "uio",
    "user",
    "zerocopy",
] }
tokio = { version = "1.53.3", optional = true }
vm-memory = { workspace = true }

# Linux-only runtime dependencies: mio's epoll-backed `Poll`/`Waker` drives
# the exit channel of the Linux session, only its asyncio module and the
# io_uring transport consume futures-util (so the `async-io` feature stays
# meaningful on FreeBSD/macOS without dragging an unused dependency into
# their build graphs), and only the Linux session needs vmm-sys-util at
# runtime (ScmSocket) — the tests of every session backend use its temp
# files, hence the dev-dependency below.
[target.'cfg(target_os = "linux")'.dependencies]
mio = { version = "0.8", features = ["os-poll", "os-ext"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["alloc", "std"] }
io-uring = { version = "0.6", optional = true }
vmm-sys-util = { workspace = true }

[dev-dependencies]
# tests/async_serving_load.rs waits for a tokio timer in a handler.
tokio = { version = "1.53.3", features = ["time"] }
vmm-sys-util = { workspace = true }

# The tests exercising a live session against a real filesystem driver use
# `PassthroughFs`, which lives in its own crate.
[target.'cfg(target_os = "linux")'.dev-dependencies]
fuse-backend-passthrough = { path = "../fuse-backend-passthrough", version = "0.14.0" }

[features]
default = []
async-io = [
    "async-trait",
    "futures-util",
    "tokio/rt",
    "tokio/macros",
    "tokio/net",
    "tokio/time",
    "fuse-backend-core/async-io",
    # The session tests mount a real `PassthroughFs`, and core's
    # `BackendFileSystem` requires `AsyncFileSystem` once core's `async-io`
    # is on, so the dev-dependency must be unified with this feature.
    "fuse-backend-passthrough/async-io",
]
# Experimental: FUSE-over-io_uring transport (kernel >= 6.14, protocol 7.42).
# The kernel interface is still evolving (queue-count reduction, bufpool
# extensions); the API and ABI target may change between releases.
# The transport maps its buffers with vm-memory's `MmapRegion`, whose
# `backend-mmap` feature doesn't build on FreeBSD. Only this feature turns it
# on, because the workspace's version 1 resolver would turn on the features
# of a Linux-only dependency entry for FreeBSD too.
uring = ["io-uring", "fuse-backend-core/fusedev-uring", "vm-memory/backend-mmap"]
# Serve through the fuse-t library (https://github.com/macos-fuse-t/fuse-t)
# instead of macFUSE on macOS. Core applies fuse-t specific reply quirks
# under its own `fuse-t` cfg.
fuse-t = ["fuse-backend-core/fuse-t"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
