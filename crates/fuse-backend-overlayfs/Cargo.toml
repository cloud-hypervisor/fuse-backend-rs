[package]
name = "fuse-backend-overlayfs"
version = "0.14.0"
keywords = ["fuse", "overlayfs", "union-filesystem"]
categories = ["filesystem", "os::linux-apis"]
description = "An overlay FUSE filesystem driver stacking multiple read-only layers under a writable layer (Linux-only)"
authors = [
    "Liu Bo <bo.liu@linux.alibaba.com>",
    "Liu Jiang <gerry@linux.alibaba.com>",
    "Peng Tao <bergwolf@hyper.sh>",
]
license = "Apache-2.0 AND BSD-3-Clause"
edition = "2018"
rust-version = "1.80"
repository = "https://github.com/cloud-hypervisor/fuse-backend-rs"
homepage = "https://github.com/cloud-hypervisor/"
readme = "README.md"
documentation = "https://docs.rs/fuse-backend-overlayfs"

[dependencies]
fuse-backend-core = { path = "../fuse-backend-core", version = "0.14.0" }
libc = "0.2.68"
log = "0.4.6"
radix_trie = "0.2.1"
vmm-sys-util = { workspace = true }

[features]
default = []
async-io = ["fuse-backend-core/async-io"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
